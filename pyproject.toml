[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "blockchain-course-a02"
version = "0.1.0"
description = "A learning-focused three-node blockchain network implemented with Flask."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "Flask>=3.0,<4.0",
    "requests>=2.32,<3.0",
]

[tool.setuptools]
py-modules = ["app", "block", "blockchain", "main", "network"]
